name: Express CI/CD Pipeline

on:
  push:
    branches: [ main ] 
  pull_request:
    branches: [ main ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client 
        env:
          DATABASE_URL: "postgresql://mock_user:mock_password@localhost:5432/mock_db?schema=public" # <--- التعديل الأول هنا لتخطي فحص الـ CI
        run: npx prisma generate

      - name: Run Linting (Optional)
        run: npm run lint --if-present

  continuous-deployment:
    needs: continuous-integration 
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            DATABASE_URL=postgresql://mock_user:mock_password@localhost:5432/mock_db?schema=public
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/express-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/express-app:${{ github.sha }}

